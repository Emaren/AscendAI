name: AscendAI Security Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  security-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
